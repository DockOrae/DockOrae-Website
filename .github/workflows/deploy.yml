# ============================================================
# DockOrae Docs — GitHub Pages 部署
#
# 触发:
#   - push main:构建 + 部署到 GitHub Pages
#   - pull request:仅执行构建检查(不部署)
#   仅 docs/ 等文档相关改动触发,工作流/仓库元数据改动不触发。
#
# 自定义域名时(如 docs.dockorae.com):
#   1. 仓库 Settings → Pages → Custom domain 填写域名(自动写 CNAME)
#   2. 本工作流 build 步骤将 VITE_BASE 改为 "/"(域名根路径)
#   3. SITE_URL 改为 https://docs.dockorae.com
# ============================================================
name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.vitepress/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - '.vitepress/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # 版本号拉取(GitHub API)避免未认证限流
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 项目页部署路径(自定义域名时改为 /)
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
