name: Deploy Docs

on:
  push:
    branches:
      - main
    paths:
      - 'pages/**'
      - 'locales/**'
      - 'components/**'
      - 'layouts/**'
      - 'assets/**'
      - 'public/**'
      - 'valaxy.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/gh-pages.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'pages/**'
      - 'locales/**'
      - 'components/**'
      - 'layouts/**'
      - 'assets/**'
      - 'public/**'
      - 'valaxy.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/gh-pages.yml'

# GitHub Actions 部署 Pages 所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个 Pages 部署
concurrency:
  group: pages
  cancel-in-progress: false

env:
  DEPLOY_PLATFORM: 'github'
  # 自定义域名:base 为根路径;若用项目页地址(无域名),改为 /${{ github.event.repository.name }}/
  VITE_BASE: /
  SITE_URL: https://doc.kejizero.xyz

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.12.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install Deps
        run: pnpm install --frozen-lockfile

      - name: Build Docs
        env:
          NODE_OPTIONS: --max_old_space_size=8192
          DEPLOY_PLATFORM: github
        run: pnpm run build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
